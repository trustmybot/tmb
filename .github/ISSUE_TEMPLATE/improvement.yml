name: Improvement
description: Something tmb already does, but could do better
labels: ["type/improvement", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: Plain words are enough. You do not need to know how tmb works inside. Only the first question is required.
  - type: textarea
    id: current
    attributes:
      label: What happens today?
      description: What tmb does now, and what is slow, confusing or awkward about it.
      placeholder: |
        After every task I am asked the same question about the branch name.
        I answer the same way each time.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would be better?
      description: Optional. How you would like it to work. Leave it empty if you only know what bothers you.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Optional. Your best guess; a maintainer corrects it, so a wrong guess is fine.
        - Workflow: tasks, reviews, branches, or something you did was blocked.
        - Record: what tmb remembers about the work, and its tools.
        - Code graph: what tmb knows about your code, and its search.
        - Roles: the planner, a worker or the reviewer did the wrong thing.
        - Host setup: what tmb adds to your agent program, such as Claude Code.
        - Dashboard: the dashboard page.
        - Install and update: installing, updating or starting tmb.
      options:
        - Workflow
        - Record
        - Code graph
        - Roles
        - Host setup
        - Dashboard
        - Install and update
    validations:
      required: false
