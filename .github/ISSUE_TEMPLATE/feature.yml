name: Feature request
description: Something you wish tmb could do
labels: ["type/feature", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: Plain words are enough. You do not need to know how tmb works inside. Only the first question is required.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: What you are trying to get done, and what stops you today.
      placeholder: |
        I want to pause a task and pick it up tomorrow.
        Today the work starts over when I close the session.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Optional. Your idea of how tmb could do it. Leave it empty if you do not have one.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Optional. Your best guess; a maintainer corrects it, so a wrong guess is fine.
        - Workflow: tasks, reviews, branches, or something you did was blocked.
        - Record: what tmb remembers about the work, and its tools.
        - Code graph: what tmb knows about your code, and its search.
        - Roles: the planner, a worker or the reviewer did the wrong thing.
        - Host setup: what tmb adds to your agent program, such as Claude Code.
        - Dashboard: the dashboard page.
        - Install and update: installing, updating or starting tmb.
      options:
        - Workflow
        - Record
        - Code graph
        - Roles
        - Host setup
        - Dashboard
        - Install and update
    validations:
      required: false
