name: ci

# Pull requests and pushes to dev run the Linux `test` and `chain` jobs only. The heavy jobs
# (`update-scenario`, `benchmark`) run on version tags (rc and stable), so CI never slows a lane
# down (trustmybot/tmb#164). Needs no secret.

on:
  pull_request:
  push:
    branches: [dev]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:boundaries
      # The code graph's coverage test also runs on hono at one pinned commit (trustmybot/tmb#247):
      # one shallow fetch of that commit, about 8 MB, kept in the cache after the first run.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pinned/hono
          key: pinned-hono-75ff8e3ea18485589816881c6278bc9783e56602
      - run: bun tests/lib/pinned-repo.ts "$RUNNER_TEMP/pinned/hono"
      - run: bun test
        env:
          TMB_PINNED_HONO: ${{ runner.temp }}/pinned/hono
      - run: bun tests/lint/links.ts

  # The chained test's steps that use no model, in one empty Linux container: tmb installed by
  # the real install script, then init, doctor, onboard and index on one record (trustmybot/tmb#260).
  # The session steps need the model login and run on a developer's machine until it is set.
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun tests/chain/container.ts --out "$RUNNER_TEMP/chain"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chain-logs
          path: |
            ${{ runner.temp }}/chain/work/logs
            ${{ runner.temp }}/chain/work/states
      # The states saved before each step of the last passing run on dev, to run a step alone
      # from (tests/README.md says how).
      - if: success() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: chain-states
          path: ${{ runner.temp }}/chain/work/states
          retention-days: 30

  # Each channel's install updating itself, against a local release repo, on the platforms
  # the test job does not run on (trustmybot/tmb#57). Runs on version tags only, so a
  # platform's update path is caught at the rc tag, not on a pull request (trustmybot/tmb#164).
  update-scenario:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun test tests/workflow/flow-1.2-updates-and-channels.test.ts

  # The code graph's benchmark (trustmybot/tmb#244): tmb and the public repos, each at its pinned
  # commit, scored against its language's own tool. tmb's pin is read from its own history, so the
  # checkout is full. Fails when a score stored in
  # tests/benchmark/scores.json falls. A heavy job: version tags only. Links right for TypeScript
  # runs on every pull request in the test job.
  benchmark:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: |
          bun tests/lib/pinned-repo.ts hono "$RUNNER_TEMP/pinned/hono"
          bun tests/lib/pinned-repo.ts flask "$RUNNER_TEMP/pinned/flask"
          bun tests/lib/pinned-repo.ts datasette "$RUNNER_TEMP/pinned/datasette"
          bun tests/lib/pinned-repo.ts gin "$RUNNER_TEMP/pinned/gin"
          bun tests/lib/pinned-repo.ts jsoup "$RUNNER_TEMP/pinned/jsoup"
          bun tests/lib/pinned-repo.ts ripgrep "$RUNNER_TEMP/pinned/ripgrep"
          bun tests/lib/pinned-repo.ts libuv "$RUNNER_TEMP/pinned/libuv"
          bun tests/lib/pinned-repo.ts leveldb "$RUNNER_TEMP/pinned/leveldb"
      - run: bun tests/benchmark/run.ts --check
        env:
          TMB_PINNED_HONO: ${{ runner.temp }}/pinned/hono
          TMB_PINNED_FLASK: ${{ runner.temp }}/pinned/flask
          TMB_PINNED_DATASETTE: ${{ runner.temp }}/pinned/datasette
          TMB_PINNED_GIN: ${{ runner.temp }}/pinned/gin
          TMB_PINNED_JSOUP: ${{ runner.temp }}/pinned/jsoup
          TMB_PINNED_RIPGREP: ${{ runner.temp }}/pinned/ripgrep
          TMB_PINNED_LIBUV: ${{ runner.temp }}/pinned/libuv
          TMB_PINNED_LEVELDB: ${{ runner.temp }}/pinned/leveldb
