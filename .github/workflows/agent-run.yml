name: agent run

# Greets a real Claude Code session in a project set up with the dev build and checks bro
# answers. Runs only on request, and only does anything when CLAUDE_CODE_OAUTH_TOKEN is set.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-run:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without the token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice title=agent run skipped::Set the CLAUDE_CODE_OAUTH_TOKEN repository secret to run the agent test."
      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Install tmb from the dev channel
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          curl -fsSL https://github.com/trustmybot/tmb-releases/releases/download/dev/install.sh -o "$RUNNER_TEMP/install.sh"
          TMB_NO_MODIFY_PATH=1 sh "$RUNNER_TEMP/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the agent test
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: sh tests/agent-run/run.sh
