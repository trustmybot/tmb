name: agent run

# The whole chained test, its session steps included, with real Claude Code sessions
# (tests/chain, trustmybot/tmb#260). Its steps replaced the agent runs and agent chains that
# lived in tests/agent-run and tests/agent-chain; the second-host chain stays a script of its own.
# Runs only on request, and only does anything when CLAUDE_CODE_OAUTH_TOKEN is set.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole chained test, the session steps included, in one empty Linux container
  # (trustmybot/tmb#260). The login is passed into the container by name only.
  whole-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without the token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice title=whole chain skipped::Set the CLAUDE_CODE_OAUTH_TOKEN repository secret to run the whole chain."
      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - uses: oven-sh/setup-bun@v2
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          bun-version: "1.4"
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: bun install --frozen-lockfile
      - name: Run the whole chain
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: bun tests/chain/container.ts --out "$RUNNER_TEMP/chain" --with-model
      - if: always() && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: whole-chain
          path: |
            ${{ runner.temp }}/chain/work/logs
            ${{ runner.temp }}/chain/work/states
