name: dev release

# Publishes every push to dev as the rolling `dev` prerelease of the public
# trustmybot/tmb-releases repo, so installs need no login. Installs on the dev channel
# read its VERSION asset to update themselves.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Computed once so every build target and the release carry the same version.
  version:
    runs-on: ubuntu-latest
    outputs:
      tmb_version: ${{ steps.version.outputs.tmb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and full history to count commits since the last stable tag
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - id: version
        run: |
          version=$(bun scripts/dev-version.ts)
          echo "tmb_version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Darwin binaries are built and ad-hoc signed on macOS so they run there.
          - runner: macos-latest
            targets: darwin-arm64 darwin-x64
            sign: true
          - runner: ubuntu-latest
            targets: linux-x64 linux-arm64 windows-x64
            sign: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/build.ts ${{ matrix.targets }}
        env:
          TMB_VERSION: ${{ needs.version.outputs.tmb_version }}
      - name: Ad-hoc sign
        if: matrix.sign
        run: for f in dist/tmb-darwin-*; do codesign --force --sign - "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: tmb-${{ matrix.runner }}
          path: dist/tmb-*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TMB_RELEASES_TOKEN }}
      RELEASES_REPO: trustmybot/tmb-releases
      TMB_VERSION: ${{ needs.version.outputs.tmb_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect assets and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          echo "$TMB_VERSION" > dist/VERSION
          cd dist
          for f in tmb-darwin-arm64 tmb-darwin-x64 tmb-linux-x64 tmb-linux-arm64 tmb-windows-x64.exe; do
            test -f "$f" || { echo "missing asset $f" >&2; exit 1; }
          done
          sha256sum tmb-* install.sh install.ps1 VERSION > SHA256SUMS
          cat SHA256SUMS
      - name: Replace the dev prerelease
        run: |
          gh release delete dev --repo "$RELEASES_REPO" --yes --cleanup-tag || true
          gh release create dev --repo "$RELEASES_REPO" --prerelease --title "dev (${TMB_VERSION})" \
            --notes "Rolling dev build ${TMB_VERSION} from trustmybot/tmb@${GITHUB_SHA}." \
            dist/tmb-* dist/install.sh dist/install.ps1 dist/VERSION dist/SHA256SUMS

  # Installs the release just published, the way a user does, on every OS. Needs no secret.
  install-test:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      TMB_EXPECTED_VERSION: ${{ needs.version.outputs.tmb_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh tests/install/smoke.sh dev "$TMB_EXPECTED_VERSION"
      - name: Install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install/smoke.ps1 -Channel dev -ExpectedVersion $env:TMB_EXPECTED_VERSION

  # An older dev install updates itself to the release just published, between sessions and
  # never while a session runs, on every OS. Needs no secret.
  install-update:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun tests/install/update.ts dev "${{ needs.version.outputs.tmb_version }}"
        shell: bash
