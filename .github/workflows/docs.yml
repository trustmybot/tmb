name: docs

# Builds the docs site from docs/ and publishes it to GitHub Pages.
# A pull request only builds; a merge to dev publishes.

on:
  push:
    branches: [dev]
    paths: ["docs/**", "zensical.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "zensical.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install zensical==0.1.4
      - run: zensical build --clean
      - name: Fail on an empty site
        run: test "$(find site -name index.html | wc -l)" -ge 20
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
